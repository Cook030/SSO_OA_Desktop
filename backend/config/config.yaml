cors:
  allow_origins:
    - "https://oa.maplehaze.cn"
    - "http://local-nextui.maplehaze.cn:8004"   # 本地/开发前端（sso 接口设计文档示例）
  allow_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
  allow_headers:
    - "Origin"
    - "Content-Type"
    - "Accept"
  expose_headers: []
  allow_credentials: true             # 允许携带 Cookie 等凭证时，allow_origins 不能为 *，必须显式指定
  max_age: 86400

sso:
  base_url: "http://mh-sso2-svc"
  introspect_path: "/api/v1/auth/introspect"
  revoke_user_sessions_path: "/api/v1/auth/revoke-user-sessions"
  timeout_second: 5
