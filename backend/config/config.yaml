  database: ssp
  charset: utf8mb4
  max_idle_conns: 10
  max_open_conns: 100

admin:
  account: admin
  password: Mhint@123       # 管理员初始密码
  name: 管理员
  phone: "13800000000"                # 替换为管理员手机号
