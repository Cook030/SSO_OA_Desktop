version: "0.1"                        # 配置版本号

database:
  dsn: "maplehaze:Mhint@123@tcp(127.0.0.1:3307)/ssp?parseTime=true"  # 数据库连接串
  db: "mysql"                         # 数据库类型

  tables:                             # 要生成模型的表名列表
    - sys_platform
    - sys_user
    - sys_user_platform

  outPath: "./internal/db_model"                 # 生成代码输出目录（相对路径）
  outFile: ""                         # 输出文件名（空则按表名生成多个文件）
  withUnitTest: false                 # 是否生成单元测试文件
  modelPkgName: "db_model"      # 生成代码的 package 名

  onlyModel: false                    # 只生成 model，不生成 query 代码
  fieldNullable: true                 # 字段可 NULL 时用指针类型
  fieldWithIndexTag: false            # 是否在字段 tag 中标注索引
  fieldWithTypeTag: false             # 是否在字段 tag 中标注数据库类型
