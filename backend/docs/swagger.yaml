basePath: /api
definitions:
  request.AssignPermissionsRequest:
    properties:
      permissionIds:
        items:
          type: integer
        type: array
    type: object
  request.AssignUsersRequest:
    properties:
      roleIds:
        items:
          type: integer
        type: array
      userIds:
        items:
          type: integer
        type: array
    type: object
  request.CreateEmployeeRequest:
    properties:
      account:
        type: string
      department:
        type: string
      emailPrefix:
        type: string
      name:
        type: string
      password:
        type: string
      phone:
        type: string
      roleIds:
        items:
          type: integer
        type: array
    type: object
  request.CreatePermissionRequest:
    properties:
      code:
        type: string
      name:
        type: string
      parentId:
        type: integer
      platformId:
        type: integer
      sort:
        type: integer
      type:
        type: integer
    type: object
  request.CreateRoleRequest:
    properties:
      code:
        type: string
      description:
        type: string
      name:
        type: string
    type: object
  request.PlatformRequest:
    properties:
      code:
        type: string
      name:
        type: string
    type: object
  request.SetUserRolesRequest:
    properties:
      roleIds:
        items:
          type: integer
        type: array
    type: object
  request.UpdateEmployeeRequest:
    properties:
      account:
        type: string
      department:
        type: string
      emailPrefix:
        type: string
      name:
        type: string
      phone:
        type: string
      roleIds:
        items:
          type: integer
        type: array
    type: object
  request.UpdateRoleRequest:
    properties:
      description:
        type: string
      name:
        type: string
      status:
        type: integer
    type: object
  response.BatchAssignResultDTO:
    properties:
      affectedCount:
        type: integer
    type: object
  response.CreateEmployeeDTO:
    properties:
      account:
        type: string
      displayId:
        type: string
      email:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  response.EmployeeListItemDTO:
    properties:
      account:
        type: string
      department:
        type: string
      displayId:
        type: string
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      phone:
        type: string
      platformPermissions:
        items:
          $ref: '#/definitions/response.PlatformPermission'
        type: array
      roles:
        items:
          $ref: '#/definitions/response.RoleOptionDTO'
        type: array
    type: object
  response.EmployeePageResult:
    properties:
      list:
        items:
          $ref: '#/definitions/response.EmployeeListItemDTO'
        type: array
      total:
        type: integer
    type: object
  response.MePermissionDTO:
    properties:
      isAdmin:
        type: boolean
      permissions:
        items:
          type: string
        type: array
      platforms:
        items:
          $ref: '#/definitions/response.PlatformPermission'
        type: array
      roles:
        items:
          type: string
        type: array
      userId:
        type: integer
    type: object
  response.PermissionNode:
    properties:
      children:
        items:
          $ref: '#/definitions/response.PermissionNode'
        type: array
      code:
        type: string
      id:
        type: integer
      name:
        type: string
      parentId:
        type: integer
      platformId:
        type: integer
      sort:
        type: integer
      status:
        type: integer
      type:
        type: integer
    type: object
  response.PlatformDTO:
    properties:
      code:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  response.PlatformListItemDTO:
    properties:
      code:
        type: string
      createTime:
        type: string
      id:
        type: integer
      name:
        type: string
      permissionCount:
        type: integer
    type: object
  response.PlatformPageResult:
    properties:
      list:
        items:
          $ref: '#/definitions/response.PlatformListItemDTO'
        type: array
      total:
        type: integer
    type: object
  response.PlatformPermission:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  response.RoleDTO:
    properties:
      code:
        type: string
      description:
        type: string
      id:
        type: integer
      isBuiltin:
        type: integer
      name:
        type: string
      permissions:
        items:
          type: integer
        type: array
      status:
        type: integer
    type: object
  response.RoleListItemDTO:
    properties:
      code:
        type: string
      createTime:
        type: string
      description:
        type: string
      id:
        type: integer
      isBuiltin:
        type: integer
      name:
        type: string
      permissionCount:
        type: integer
      status:
        type: integer
      userCount:
        type: integer
    type: object
  response.RoleOptionDTO:
    properties:
      code:
        type: string
      id:
        type: integer
      isBuiltin:
        type: integer
      name:
        type: string
    type: object
  response.UpdateEmployeeDTO:
    properties:
      account:
        type: string
      department:
        type: string
      displayId:
        type: string
      email:
        type: string
      id:
        type: integer
      name:
        type: string
      phone:
        type: string
    type: object
  utils.Response:
    properties:
      code:
        type: integer
      data: {}
      message:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: 这是一个基于 Go + Gin 的权限管理系统 API，支持用户认证、平台管理、员工管理和权限管理等功能。
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: 权限管理系统 API
  version: "1.0"
paths:
  /employees:
    get:
      consumes:
      - application/json
      description: 分页获取员工列表，支持搜索和筛选（默认不包含管理员账号）
      parameters:
      - description: 页码，默认1
        in: query
        name: page
        type: integer
      - description: 每页数量，默认20
        in: query
        name: pageSize
        type: integer
      - description: 搜索关键词
        in: query
        name: keyword
        type: string
      - description: 部门筛选
        in: query
        name: department
        type: string
      - description: 平台ID筛选
        in: query
        name: platformId
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/response.EmployeePageResult'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - CookieAuth: []
      summary: 获取员工列表
      tags:
      - 员工管理
    post:
      consumes:
      - application/json
      description: 创建新的员工账号并分配角色（未指定角色时默认赋予普通员工角色）
      parameters:
      - description: 员工信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.CreateEmployeeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/response.CreateEmployeeDTO'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - CookieAuth: []
      summary: 创建员工
      tags:
      - 员工管理
  /employees/{id}:
    delete:
      consumes:
      - application/json
      description: 删除指定员工及其角色绑定
      parameters:
      - description: 员工ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - CookieAuth: []
      summary: 删除员工
      tags:
      - 员工管理
    put:
      consumes:
      - application/json
      description: 更新员工信息与角色归属
      parameters:
      - description: 员工ID
        in: path
        name: id
        required: true
        type: integer
      - description: 员工信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.UpdateEmployeeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/response.UpdateEmployeeDTO'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - CookieAuth: []
      summary: 更新员工
      tags:
      - 员工管理
  /employees/{id}/reset-password:
    put:
      consumes:
      - application/json
      description: 将指定员工的密码重置为默认密码，密码版本递增使旧 token 失效，员工下次登录需修改密码
      parameters:
      - description: 员工ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - CookieAuth: []
      summary: 重置员工密码
      tags:
      - 员工管理
  /employees/departments:
    get:
      consumes:
      - application/json
      description: 获取所有部门名称列表
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  items:
                    type: string
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - CookieAuth: []
      summary: 获取部门列表
      tags:
      - 员工管理
  /me/permissions:
    get:
      consumes:
      - application/json
      description: 返回当前登录用户的角色、权限编码与可访问平台，供前端做菜单与按钮控制
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/response.MePermissionDTO'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - CookieAuth: []
      summary: 获取当前用户权限
      tags:
      - 权限管理
  /permissions:
    get:
      consumes:
      - application/json
      description: 按父子关系返回全部权限点，供角色授权时勾选
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/response.PermissionNode'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - CookieAuth: []
      summary: 获取权限树
      tags:
      - 权限管理
    post:
      consumes:
      - application/json
      description: 新增一个权限点（菜单或 API）
      parameters:
      - description: 权限点信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.CreatePermissionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/response.PermissionNode'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - CookieAuth: []
      summary: 创建权限点
      tags:
      - 权限管理
  /platforms:
    get:
      consumes:
      - application/json
      description: 分页获取平台列表
      parameters:
      - description: 页码，默认1
        in: query
        name: page
        type: integer
      - description: 每页数量，默认20
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/response.PlatformPageResult'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - CookieAuth: []
      summary: 获取平台列表
      tags:
      - 平台管理
    post:
      consumes:
      - application/json
      description: 创建新的平台
      parameters:
      - description: 平台信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.PlatformRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/response.PlatformDTO'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - CookieAuth: []
      summary: 创建平台
      tags:
      - 平台管理
  /platforms/{id}:
    delete:
      consumes:
      - application/json
      description: 删除指定平台
      parameters:
      - description: 平台ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - CookieAuth: []
      summary: 删除平台
      tags:
      - 平台管理
    put:
      consumes:
      - application/json
      description: 更新平台信息
      parameters:
      - description: 平台ID
        in: path
        name: id
        required: true
        type: integer
      - description: 平台信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.PlatformRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/response.PlatformDTO'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - CookieAuth: []
      summary: 更新平台
      tags:
      - 平台管理
  /roles:
    get:
      consumes:
      - application/json
      description: 获取全部角色，并附带动用户数与权限数
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/response.RoleListItemDTO'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - CookieAuth: []
      summary: 获取角色列表
      tags:
      - 角色管理
    post:
      consumes:
      - application/json
      description: 创建新的自定义角色（内置角色由初始化脚本预置）
      parameters:
      - description: 角色信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.CreateRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/response.RoleDTO'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - CookieAuth: []
      summary: 创建角色
      tags:
      - 角色管理
  /roles/{id}:
    delete:
      consumes:
      - application/json
      description: 删除指定角色（内置角色、仍有用户绑定的角色不可删除）
      parameters:
      - description: 角色ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - CookieAuth: []
      summary: 删除角色
      tags:
      - 角色管理
    put:
      consumes:
      - application/json
      description: 更新角色名称、描述与状态（内置角色不可停用）
      parameters:
      - description: 角色ID
        in: path
        name: id
        required: true
        type: integer
      - description: 角色信息
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.UpdateRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/response.RoleDTO'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - CookieAuth: []
      summary: 更新角色
      tags:
      - 角色管理
  /roles/{id}/permissions:
    get:
      consumes:
      - application/json
      description: 返回该角色已授权的权限点ID列表
      parameters:
      - description: 角色ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  items:
                    type: integer
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - CookieAuth: []
      summary: 查询角色持有的权限
      tags:
      - 角色管理
    put:
      consumes:
      - application/json
      description: 全量覆盖角色的权限点授权
      parameters:
      - description: 角色ID
        in: path
        name: id
        required: true
        type: integer
      - description: 权限ID列表
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.AssignPermissionsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/utils.Response'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/utils.Response'
      security:
      - CookieAuth: []
      summary: 给角色配置权限
      tags:
      - 角色管理
  /roles/users:
    post:
      consumes:
      - application/json
      description: 为多个用户增量分配指定角色（已存在的不重复插入）
      parameters:
      - description: 用户与角色ID
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/request.AssignUsersRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/response.BatchAssignResultDTO'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Response'
        "401":
          description: Unauthorized
          schema:
