server:
  port: 8080
  mode: release

log:
  path: "logs/test.log"
  max_size: 10
  max_backups: 3
  max_age: 7
  compress: false
  local_time: true

mysql:
  host: mysql
  port: 3306
  username: root
  password: test_password_123
  database: maplehaze_permission_test
  charset: utf8mb4
  max_idle_conns: 10
  max_open_conns: 100

admin:
  account: admin
  password: Mhint@123
  name: 管理员
  phone: "13800000000"
  email: admin@maplehaze.cn

cors:
  allow_origins:
    - "http://localhost:5173"
  allow_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
  allow_headers:
    - "Origin"
    - "Content-Type"
    - "Accept"
  expose_headers: []
  allow_credentials: true
  max_age: 86400

sso:
  base_url: "http://mock-sso:9090"    # 容器测试环境由 mock SSO 服务覆盖，TestMain 中会替换为实际地址
  introspect_path: "/api/v1/auth/introspect"
  revoke_user_sessions_path: "/api/v1/auth/revoke-user-sessions"
  timeout_second: 5
