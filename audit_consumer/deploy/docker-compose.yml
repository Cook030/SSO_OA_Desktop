# 本地联调基础设施: ZooKeeper + Kafka + Canal
# 用法:
#   docker compose -f deploy/docker-compose.yml up -d
# 注意:
#   - 若已有可用的 MySQL(开启 ROW binlog)实例, 无需启动下方注释的 mysql 服务,
#     并把 deploy/canal/instance.properties 的 master.address 指向它。
#   - mysql 服务仅在本地没有任何 MySQL 时用于快速起一套带 binlog 的实例。
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: audit-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: audit-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
    depends_on:
      - zookeeper

  canal:
    image: canal/canal-server:v1.1.7
    container_name: audit-canal
    ports:
      - "11110:11110"
      - "11111:11111"
      - "11112:11112"
    volumes:
      # 挂载 instance 配置到默认 destination(example)
      - ./canal/instance.properties:/home/admin/canal-server/conf/example/instance.properties:ro
    depends_on:
      - kafka

  # 可选: 本地快速起一套带 ROW binlog 的 MySQL(与已有 sso MySQL 端口冲突时注释掉)
