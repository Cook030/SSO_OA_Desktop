# audit-consumer 配置示例
# 使用方式: 复制为 config/config.yaml 后按实际环境修改
# 支持 ${ENV} 环境变量占位, 例如 ${AUDIT_MYSQL_PASSWORD}

kafka:
  brokers:
    - "127.0.0.1:9092"
  topic: "mh.audit.binlog"
  group_id: "audit-consumer"
  batch_size: 500            # 单批最多消息条数(攒批提交)
  flush_interval_ms: 1000    # 攒批时间上限(ms)
  fetch_max_wait_ms: 500     # 单次拉取最长等待(ms)
  session_timeout_ms: 10000  # 消费组会话超时(ms)
  retry_max_backoff_ms: 30000

mysql:
  host: "127.0.0.1"
  port: 3306
  username: "root"
  password: "${AUDIT_MYSQL_PASSWORD}"
  database: "oa_manage"            # sys_audit_log 所在库(与 sso 业务同实例)
  charset: "utf8mb4"
  max_open_conns: 20
  max_idle_conns: 5

sanitize:
  # 命中以下列名的值会被整体替换为 replacement, 防止密码/token 等明文落审计库
  fields:
    - password
    - password_hash
    - salt
    - secret
  replacement: "******"

# 表 -> target_type / 主键列(用于 target_id)
# 非关联表 action = <target_type>:create|update|delete
# 关联表(user_role 等)在代码中映射为 assign-role/unassign-role 语义
mapping:
  sys_user:            { target_type: user,       key: id }
  sys_platform:        { target_type: platform,   key: id }
  sys_role:            { target_type: role,       key: id }
  sys_permission:      { target_type: permission, key: id }
  sys_user_role:       { target_type: user,       key: user_id }
  sys_role_permission: { target_type: role,       key: role_id }
  sys_user_platform:   { target_type: user,       key: user_id }

log:
  level: "info"          # debug / info / warn / error
