<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>枫岚 Ant Design 组件库开发预览</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Oxygen", "Ubuntu", "Cantarell", "Fira Sans",
          "Droid Sans", "Helvetica Neue", sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background: #f0f2f5;
      }
      #root {
        min-height: 100vh;
      }
    </style>
  </head>
  <body>
    <div id="root" style="color: #333; font-size: 14px">Loading...</div>
    <script>
      (() => {
        var root = document.getElementById("root");
        function showError(title, detail) {
          if (!root) return;
          root.innerHTML =
            '<div style="padding:16px;background:#fff;border:1px solid #ffccc7;border-radius:8px;">' +
            '<div style="font-weight:600;color:#a8071a;margin-bottom:8px;">' +
            title +
            "</div>" +
            '<pre style="margin:0;white-space:pre-wrap;word-break:break-word;color:#333;">' +
            String(detail || "") +
            "</pre>" +
            "</div>";
        }

        window.addEventListener("error", (e) => {
          showError("Runtime Error", (e?.error?.stack) || (e?.message) || e);
        });

        window.addEventListener("unhandledrejection", (e) => {
          var reason = e?.reason;
          showError("Unhandled Promise Rejection", (reason?.stack) || reason);
        });
      })();
    </script>
    <script src="./bundle.js"></script>
  </body>
</html>
