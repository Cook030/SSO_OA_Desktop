# =============================================================
# Canal instance 配置: 采集 sso 库业务表 binlog -> Kafka
# 挂载到 canal-server 容器的 conf/example/instance.properties
# 注意事项:
#   1) 目标 MySQL 需开启 ROW 模式 binlog: binlog_format=ROW, binlog_row_image=FULL
#   2) 把下方 master.address 与 filter.regex 中的库名(oa_manage)换成实际库名
#   3) 数据源账号需具备 SELECT, REPLICATION SLAVE, REPLICATION CLIENT
# =============================================================

# 伪从库 server-id(全局唯一, 不能与任何真实从库冲突)
canal.instance.mysql.slaveId = 1234

# 数据源地址: sso 业务库所在 MySQL 实例
canal.instance.master.address = mysql:3306

# 位点: 留空从当前最新位点启动; 首次初始化可手动指定 journal/position
canal.instance.master.journal.name =
canal.instance.master.position =
canal.instance.master.gtid =

# 数据源账号
canal.instance.dbUsername = canal
canal.instance.dbPassword = canal123

# 表过滤: 白名单(只采集被审计的业务表, 库名按实际修改)
canal.instance.filter.regex = oa_manage\\.sys_user,oa_manage\\.sys_platform,oa_manage\\.sys_role,oa_manage\\.sys_permission,oa_manage\\.sys_user_role,oa_manage\\.sys_role_permission,oa_manage\\.sys_user_platform

# 黑名单: 审计表自身(防止 binlog 回环)
canal.instance.filter.black.regex = oa_manage\\.sys_audit_log

# 开启 TSDB, 记录表结构变更(ADD COLUMN 等场景解析不中断)
canal.instance.tsdb.enable = true
canal.instance.tsdb.dir = ${canal.file.data.dir:../conf}/tsdb

# 心跳表(默认使用 MySQL 自带; 若自建请替换)
canal.instance.heartbeat.sql = select now()

# ---------- MQ 投递到 Kafka ----------
canal.mq.servers = kafka:9092
canal.mq.topic = mh.audit.binlog
canal.mq.partitionsNum = 3
# 同一主键路由到同一分区, 保证同一条记录按序投递
canal.mq.partitionHash = .*\\..*:$pk$
# protobuf 消息格式(CanalPacket 封装):
#   Kafka value = Packet(type=MESSAGES, body=Messages)
#   Messages.messages 每项是 CanalEntry.Entry; ROWDATA 的 Entry.storeValue 为 RowChange
# binlog 位点(logfileName/logfileOffset)在 Entry.header, 供消费端做精确幂等。
# 注意: 切换后消费端(audit-consumer)与测试样例必须按 protobuf 协议解析, 不再兼容 flat JSON。
canal.mq.flatMessage = false
# 单条消息聚合大小
canal.mq.batchSize = 100
canal.mq.timeout = 1000
