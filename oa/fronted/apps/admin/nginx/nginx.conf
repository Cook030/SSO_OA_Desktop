#user  nobody;
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    gzip on;
    # gzip_static on;              # ✅ 让 Nginx 自动查找 .gz 文件
    gzip_types application/javascript text/css application/json;

    # 网关/Ingress 终止 TLS 后，用外部协议与 Host 生成重定向，避免暴露容器端口 8001
    map $http_x_forwarded_proto $redirect_scheme {
        default $scheme;
        https https;
        http http;
    }

    server {
        listen       8001;
        server_name  localhost;

        absolute_redirect off;
        port_in_redirect off;

        #charset koi8-r;

        #access_log  logs/host.access.log  main;
        root /usr/share/nginx/html;
        # 默认首页
        index index.html;

        # 根路径直接进入默认业务页（使用外部 Host，不带 :8001）
        location = / {
            return 302 $redirect_scheme://$http_host/admin/permission/platforms;
        }

        location / {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires 0;
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
            add_header Access-Control-Allow-Headers '*' always;
            try_files $uri /admin/index.html;
        }


        # # SSO 认证相关请求代理到 SSO2 服务（/api/v1/auth/me、/api/v1/auth/logout 等）
