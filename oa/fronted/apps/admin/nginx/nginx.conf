        #         return 204;
        #     }
        # }

        # # # # API请求劫持与反向代理
        # OA 后端要求 Authorization: Bearer <token>，但 SSO token 在 HttpOnly cookie 中，
        # 前端 JavaScript 无法读取。由 nginx 从 cookie 中提取 token 并注入 Authorization 头。
