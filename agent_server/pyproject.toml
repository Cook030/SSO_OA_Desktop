[project]
name = "oa-agent-server"
version = "0.1.0"
description = "Enterprise OA conversation and confirmed role assignment service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic-settings>=2.6,<3",
  "langgraph>=1,<2", "langchain-openai>=1,<2",
  "langgraph-checkpoint-postgres>=3,<4", "langgraph-checkpoint-sqlite>=3,<4",
  "psycopg[binary,pool]>=3.2,<4", "sqlalchemy>=2.0,<3",
  "httpx>=0.28,<1", "cryptography>=44",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
